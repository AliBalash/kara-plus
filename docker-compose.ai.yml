# Optional AI sidecar. Start alongside either compose file with:
# docker compose -f docker-compose.local.yml -f docker-compose.ai.yml up -d --build
# Ajil has no host port; Laravel reaches it over this compose project's private network.
services:
  app:
    environment:
      KARA_AI_ENABLED: ${KARA_AI_ENABLED:-false}
      KARA_AI_DASHBOARD_BRIEF_ENABLED: ${KARA_AI_DASHBOARD_BRIEF_ENABLED:-true}
      KARA_AI_CONTRACT_BRIEF_ENABLED: ${KARA_AI_CONTRACT_BRIEF_ENABLED:-true}
      KARA_AI_PAYMENT_BRIEF_ENABLED: ${KARA_AI_PAYMENT_BRIEF_ENABLED:-true}
      KARA_AI_CHANGES_ENABLED: ${KARA_AI_CHANGES_ENABLED:-true}
      AJIL_BASE_URL: http://ajil:8080
      AJIL_API_TOKEN: ${AJIL_API_TOKEN}
      KARA_AI_TIMEOUT: ${KARA_AI_TIMEOUT:-20}
      KARA_AI_CONNECT_TIMEOUT: ${KARA_AI_CONNECT_TIMEOUT:-3}
      KARA_AI_CACHE_TTL: ${KARA_AI_CACHE_TTL:-600}
      KARA_AI_MAX_FACTS: ${KARA_AI_MAX_FACTS:-25}
      KARA_AI_MAX_CONTEXT_BYTES: ${KARA_AI_MAX_CONTEXT_BYTES:-12000}
      KARA_AI_FAILURE_THRESHOLD: ${KARA_AI_FAILURE_THRESHOLD:-3}
      KARA_AI_CIRCUIT_COOLDOWN: ${KARA_AI_CIRCUIT_COOLDOWN:-60}
      KARA_AI_ROUTING_STRATEGY: ${KARA_AI_ROUTING_STRATEGY:-fallback_chain}
      KARA_AI_ROUTING_MODE: ${KARA_AI_ROUTING_MODE:-latency_first}
    depends_on:
      ajil:
        condition: service_healthy

  ajil:
    build:
      context: ./ajil
      dockerfile: Dockerfile
    working_dir: /app
    env_file:
      - ./ajil/.env
    environment:
      UAG_REDIS_URL: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
